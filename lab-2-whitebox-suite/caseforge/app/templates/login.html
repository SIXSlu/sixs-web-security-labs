{% extends "base.html" %}
{% block title %}sign in{% endblock %}
{% block content %}
<div class="card" style="max-width:30rem">
  <p class="note">Staff sign-in is passwordless: enter your desk email and we send a
  one-time sign-in link.</p>
  {% if sent %}<p class="ok"><b>Link sent.</b> Check your inbox (links expire after 15 minutes).</p>{% endif %}
  <form method="post" action="/api/auth/magic">
    <label>Desk email <input type="email" name="email" placeholder="you@caseforge.internal" required></label>
    <button type="submit">Send link</button>
  </form>
</div>
{% endblock %}
