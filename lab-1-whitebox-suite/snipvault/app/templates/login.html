<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnipVault — sign in</title>
  <link rel="stylesheet" href="/static/sixs.css">
</head>
<body>
  <nav class="sx-nav">
    <a class="sx-brand" href="#"><span class="mark">SX</span> SIXS&nbsp;Labs</a>
    <a class="sx-app" href="/">SnipVault</a>
    <span class="sx-tag">snippets</span>
  </nav>
  <main class="sx-main">
    <h1>SnipVault<span class="sub">Private snippet vault</span></h1>
    <div class="card" style="max-width:26rem">
      {% if error %}<p class="err">{{ error }}</p>{% endif %}
      <form method="post">
        <label>Username <input name="username" placeholder="username"></label>
        <label>Password <input name="password" type="password" placeholder="password"></label>
        <button>Sign in</button>
      </form>
      <p class="note"><a href="{{ url_for('register_page') }}">Create an account</a></p>
    </div>
  </main>
  <footer class="sx-foot"><span class="mark">SX</span> A SIXS security training lab <span class="sep">·</span> hack the planet 🌍 (localhost counts as a planet)</footer>
</body>
</html>
