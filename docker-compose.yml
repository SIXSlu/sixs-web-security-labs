# ---------------------------------------------------------------------------
# SIXS Web Security Labs — central stack
#
# Brings up every container from all six labs at once. Each lab's own
# docker-compose.yml remains the source of truth and is pulled in via
# `include:` below, so per-lab and all-in-one stay in sync.
#
#   docker compose up --build -d     # build + start every lab
#   docker compose ps                # see all services and their ports
#   docker compose logs -f           # follow startup
#   docker compose down              # stop everything (flags re-roll on restart)
#
# Host ports are disjoint across labs (8081-8086, 8088-8095), so
# all labs run side by side. Do not also run a lab's own compose at the same
# time — the two projects would fight over the same host ports.
#
# On a host whose Docker daemon cannot reach the internet from the default
# bridge during a build, run ./build-all.sh instead (host-network builds).
# ---------------------------------------------------------------------------
name: sixs-labs

include:
  - lab-1-whitebox-suite/docker-compose.yml
  - lab-2-whitebox-suite/docker-compose.yml
  - lab-3-papertrail/docker-compose.yml
  - lab-4-harbordock/docker-compose.yml
  - lab-5-tidegate/docker-compose.yml
  - lab-6-whitebox-suite/docker-compose.yml

services:
  # Flag verifier: serves the flag console and a yes/no verify oracle.
  # Reads only SHA-256 digests of this run's flags from the shared volume.
  # One-shot: make the shared flag volume world-writable (1777) before any
  # writer starts, so containers that drop privileges can still publish hashes.
  flaghashes-init:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /flaghashes && chmod 1777 /flaghashes"]
    volumes:
      - flaghashes:/flaghashes
    restart: "no"

  verifier:
    build:
      context: .
      dockerfile: verifier/Dockerfile
    environment:
      PORT: "8099"
    ports:
      - "8099:8099"
    volumes:
      - flaghashes:/flaghashes:ro
    restart: unless-stopped

  snipvault:
    depends_on:
      flaghashes-init:
        condition: service_completed_successfully
  reportsmith:
    depends_on:
      flaghashes-init:
        condition: service_completed_successfully
  caseforge:
    depends_on:
      flaghashes-init:
        condition: service_completed_successfully
  papertrail:
    depends_on:
      flaghashes-init:
        condition: service_completed_successfully

volumes:
  flaghashes:
