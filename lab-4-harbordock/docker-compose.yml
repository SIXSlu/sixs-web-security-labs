name: sixs-lab4

services:

  # ------------------------------------------------------------------
  # HarborDock: Java/Postgres manifest API (the SQLi front)
  # ------------------------------------------------------------------
  harbordock-db:
    build:
      context: ./harbordock/db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: harbordock
    networks: [dock-net]
    restart: unless-stopped

  provision:
    build:
      context: ./harbordock/db
    command: ["sh", "/provision.sh"]
    volumes:
      - ./harbordock/db/provision.sh:/provision.sh:ro
      - flaghashes:/flaghashes
    environment:
      PGPASSWORD: postgres
    networks: [dock-net]
    restart: "no"
    depends_on:
      - harbordock-db

  harbordock:
    build:
      context: ./harbordock
    ports:
      - "8089:8080"
    depends_on:
      - harbordock-db
      - provision
    networks: [dock-net]
    restart: unless-stopped

  # ------------------------------------------------------------------
  # DockOps console: the Node operator UI (the destination of the chain)
  # ------------------------------------------------------------------
  dockops:
    build:
      context: ./dockops
    ports:
      - "8090:3000"
    volumes:
      - flaghashes:/flaghashes
    depends_on:
      - harbordock-db
      - provision
    networks: [dock-net]
    restart: unless-stopped

networks:
  dock-net:

volumes:
  flaghashes:
